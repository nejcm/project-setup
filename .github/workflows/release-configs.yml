name: Release configs

on:
  push:
    branches: [main]
    paths: [package.json]

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Publish if version is new
        run: |
          spec="$(node -p "require('./package.json').name + '@' + require('./package.json').version")"
          if [ -n "$(npm view "$spec" version 2>/dev/null)" ]; then
            echo "$spec already published"
          else
            npm publish
          fi
