name: Release configs

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Publish if version is new
        run: |
          spec="$(node -p "require('./package.json').name + '@' + require('./package.json').version")"
          if [ -n "$(npm view "$spec" version 2>/dev/null)" ]; then
            echo "$spec already published"
          else
            npm publish
          fi
